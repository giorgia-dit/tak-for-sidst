{% load static %}

<!doctype html>
<html lang="it" data-bs-theme="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="rgb(37, 27, 20)">
    <title>
        {% block title %}

        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
