{% extends 'base.html' %}

{% block content %}
  <main class="container py-5">
    <h1 class="display-4">{{ card.name|lower }}</h1>

    {% if table_data.card_previous_seen_at %}
      <p class="text-body-secondary">ultima visita: {{ table_data.card_previous_seen_at }}</p>
    {% else %}
      <p class="text-body-secondary">prima visita</p>
    {% endif %}

    {% include 'table/table.html' %}
  </main>

  {{ table_data|json_script:'table-data' }}
{% endblock %}
