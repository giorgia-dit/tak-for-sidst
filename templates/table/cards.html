{% extends 'base.html' %}

{% block content %}
  <main class="container py-5">
    <h1 class="display-4">Tak for sidst</h1>

    <ol class="list-unstyled">
      {% for card in card_list %}
        <li class="{% if not card.first_touched_at %}text-body-secondary{% endif %}">
          {{ card.seat }} · {{ card.name }}
        </li>
      {% endfor %}
    </ol>
  </main>
{% endblock %}
